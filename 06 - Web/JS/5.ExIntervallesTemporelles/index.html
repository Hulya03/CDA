<!DOCTYPE html>
<html lang="fr-fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intervalles Temporelles</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <script src="./assets/js/script.js" type="module"></script>
</head>
<body>
    <fieldset>
        <h1>Gestion des dates et des intervalles</h1>
        <label for="actualDate">Date actuelle : </label>
        <input id="actualDate" type="date">                        <!-- date : car nous récupérons que date sans heures (contrairement à dateTime)  -->
        <label for="actualTime">Heure actuelle : </label>
        <input id="actualTime" type="time">
        <button id="btnDisplayCurrentDate">Afficher Date du jour</button>
        <p id="result">
        </p>

        <div class="partTwo">
            <h2>Sélectionner une date et une heure : </h2>
            <label for="inputDate">Date</label>
            <input type="inputDate" type="datetime-local">
            <button id="btn"></button>
        </div>
    </fieldset>
</body>
</html>
